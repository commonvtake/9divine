name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Hero model matches its generator
        if: runner.os == 'Linux'
        run: |
          python3 tools/blender/euphoria_hero.py build/Hero.glb
          cmp build/Hero.glb projects/Demo/Models/Hero/Hero.glb || (echo "Hero.glb is stale - run: python3 tools/blender/euphoria_hero.py" && exit 1)
